# Copy .env.example to .env first; compose reads .env automatically.
services:
  postgres:
    image: postgres:16-bookworm # pin by @sha256 in production
    environment:
      POSTGRES_USER: metamodels
      POSTGRES_PASSWORD: metamodels
      POSTGRES_DB: metamodels
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metamodels -d metamodels"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm # pin by @sha256 in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tsx-app
      args:
        APP: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: control-plane
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      LICENSE_KEY_SECRET: ${LICENSE_KEY_SECRET}
      # Consumed only by `pnpm seed` (first-run admin); harmlessly unused by `next start`.
      OPERATOR_EMAIL: ${OPERATOR_EMAIL}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tsx-app
      args:
        APP: data-plane
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
    ports:
      # PORT is effectively pinned to 8787: the container listens on env.PORT, but this
      # mapping and the healthcheck URL below hardcode 8787 — change all three together.
      - "8787:8787"
    # So the data-plane can reach an Ollama/ComfyUI running on the host (set the Flock URL
    # to http://host.docker.internal:11434 etc. in the control-plane UI).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tsx-app
      args:
        APP: worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_NAME: ${WORKER_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tsx-app
      args:
        APP: control-plane
    command: ["pnpm", "exec", "tsx", "bin/scheduler.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LICENSE_KEY_SECRET: ${LICENSE_KEY_SECRET}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-43200000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
